# Builds the binaries a release offers and updates the Homebrew tap with them.
# Nothing here compiles on the user's machine: brew downloads the archive for
# their platform and unpacks it.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gm
    main: .
    binary: gm
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: gm
    formats: [tar.gz]
    name_template: "gm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# ponytail: goreleaser has deprecated `brews` in favour of `homebrew_casks`,
# which is macOS only. A formula reaches Linuxbrew too and is not quarantined
# by Gatekeeper, so this stays until the option is actually removed; the
# replacement is a template rendered in the release workflow.
brews:
  - name: gm
    repository:
      owner: jedipunkz
      name: homebrew-gm
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/jedipunkz/gm
    description: ghq-style repository manager with a built-in fuzzy finder
    license: MIT
    commit_author:
      name: jedipunkz
      email: tomokazu.hirai@gmail.com
    commit_msg_template: "chore: bring gm to {{ .Tag }}"
    install: |
      bin.install "gm"
    test: |
      assert_match "gm", shell_output("#{bin}/gm version")
