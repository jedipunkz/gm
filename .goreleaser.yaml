# Builds the binaries a release offers and updates the Homebrew tap with them.
# Nothing here compiles on the user's machine: brew downloads the archive for
# their platform and unpacks it.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gm
    main: .
    binary: gm
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: gm
    formats: [tar.gz]
    name_template: "gm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
