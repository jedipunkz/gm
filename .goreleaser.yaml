# Builds the binaries a release offers and updates the Homebrew tap with them.
# Nothing here compiles on the user's machine: brew downloads the archive for
# their platform and unpacks it.
version: 2

builds:
  - id: gm
    # cargo-zigbuild cross-compiles every target from one Linux runner; the
    # release workflow installs it, zig and the Rust targets.
    builder: rust
    binary: gm
    # musl, so the Linux binaries are static, as the Go ones were.
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-apple-darwin
      - aarch64-apple-darwin
    env:
      # Read by option_env! in src/main.rs; `gm version` prints it.
      - GM_VERSION={{ .Version }}
    flags:
      - --release
      - --locked

archives:
  - id: gm
    formats: [tar.gz]
    name_template: "gm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
