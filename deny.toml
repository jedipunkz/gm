[advisories]
# The GHSA GitHub advisory database is not in RustSec format, so
# cargo-deny cannot read it; the RustSec DB carries the same findings, each
# with its GHSA id as an alias.
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.18+ always fails on vulnerabilities and unsound advisories;
# these keys only carve scopes.
yanked = "warn"
unmaintained = "all"
unsound = "workspace"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
