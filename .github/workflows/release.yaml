# Cuts a release on demand: pick which part of the version to increment, and
# this works out the tag, makes it, and builds from it. Nobody has to remember
# what the last version was, or type it correctly.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  # cosign keyless signing ( Fulcio ) takes its OIDC token from this job: the
  # workflow run itself is the signer, so the token must be minted and handed live.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Releases come from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "refusing to release from ${{ github.ref }}" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history and every tag: one to work the version out from,
          # the rest for the changelog.
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          : "${latest:=v0.0.0}"
          IFS=. read -r major minor patch <<<"${latest#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          # No check that the tag is free: it is always above the highest
          # one there is, and two runs at once collide on the push instead.
          next="v$major.$minor.$patch"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "$latest -> **$next**" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag it
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      # goreleaser builds every target with cargo-zigbuild, which needs zig
      # and the Rust standard library for each target.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin

      # Both pinned, so a release builds with the tools the last one did.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild@0.23.4

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Everything this workflow touches is in this repository, so the
          # token it is handed is enough. The Homebrew formula is written by
          # the tap itself, which needs no credential of ours.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sign and attest the checksums file that goreleaser just published. No
      # stored keys: cosign signs keyless with the workflow run's OIDC identity,
      # so the signature is as trustworthy as this very workflow and nothing
      # here can sign a release outside of it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and attest the checksums file
        env:
          TAG: ${{ steps.version.outputs.tag }}
          # Certificate identity flags scoped to this exact workflow. cosign
          # refuses to sign without an issuer and identity to bind, and a
          # verifier refuses a signature made by any other workflow, repo or ref.
          IDENTITY_REGEXP: ^https://github.com/jedipunkz/[.]github/workflows/(release|sign-release)[.]yaml@refs/heads/main$
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          digests="dist/checksums.txt"

          # Prove the file that came out of the build is the one being signed.
          sha256sum "${digests}"

          cosign sign-blob --yes \
            --output-signature "${digests}.sig" \
            --output-certificate "${digests}.pem" \
            --use-signing-config=false \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            "${digests}"

          # Provenance statement over that same file: who built it, where, from
          # what source, and exactly what content. slsa-provenance v1 shape, with
          # the fields cosign's slsaprovenance1 type requires.
          release="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          sum_file="$(basename "${digests}")"
          sha="$(shasum -a 256 "${digests}" | cut -d' ' -f1)"
          jq -n \
            --arg release "${release}" \
            --arg run_url "${run_url}" \
            --arg sha "${GITHUB_SHA}" \
            --arg file "${sum_file}" \
            --arg file_sha256 "${sha}" \
            '{build_definition: {build_type: "https://github.com/jedipunkz/gm/.github/workflows/release.yaml@refs/heads/main", external_parameters: {release: $release}, internal_parameters: {}, resolved_dependencies: [{name: "gm", uri: "git+https://github.com/jedipunkz/gm@refs/heads/main", digest: {gitCommit: $sha}}]}, run_details: {builder: {id: "https://github.com/jedipunkz/gm/.github/workflows/release.yaml@refs/heads/main"}, metadata: {invocation_id: $run_url}, byproducts: [{name: "checksumsFile", uri: ($release + "/download/" + $file), digest: {sha256: $file_sha256}}]}}' \
            > predicate.json

          cosign attest-blob --yes \
            --predicate predicate.json \
            --type slsaprovenance1 \
            --bundle "${digests}.attestation.json" \
            --use-signing-config=false \
            --tlog-upload=false \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            "${digests}"

      # The two published files and the bundle make the verification below
      # possible on a machine that trusts nothing but the sigstore trust root.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: checksums-signatures
          path: |
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/checksums.txt.attestation.json
