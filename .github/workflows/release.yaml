# Cuts a release from a tag: binaries for macOS and Linux, and the Homebrew
# formula that points at them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from the history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # The default token publishes the release in this repository...
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ...and this one writes the formula in the tap, which the default
          # token has no access to.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
