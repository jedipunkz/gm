# Cuts a release on demand: pick which part of the version to increment, and
# this works out the tag, makes it, and builds from it. Nobody has to remember
# what the last version was, or type it correctly.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Releases come from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "refusing to release from ${{ github.ref }}" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          # The whole history and every tag: one to work the version out from,
          # the rest for the changelog.
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          : "${latest:=v0.0.0}"
          IFS=. read -r major minor patch <<<"${latest#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          # No check that the tag is free: it is always above the highest
          # one there is, and two runs at once collide on the push instead.
          next="v$major.$minor.$patch"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "$latest -> **$next**" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag it
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      # goreleaser builds every target with cargo-zigbuild, which needs zig
      # and the Rust standard library for each target.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin

      # Both pinned, so a release builds with the tools the last one did.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild@0.23.4

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Everything this workflow touches is in this repository, so the
          # token it is handed is enough. The Homebrew formula is written by
          # the tap itself, which needs no credential of ours.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
