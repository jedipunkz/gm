# Gate on the three things that can break the build: the tests, the linter,
# and the formatting. One job, because a small repository spends more time
# setting a runner up than it does running these.
name: CI

on:
  pull_request:
    paths: &rust
      - "src/**"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pr.yaml
  push:
    branches: [main]
    paths: *rust

permissions:
  contents: read

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caches the registry and the build, keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked
