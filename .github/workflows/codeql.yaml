# CodeQL's own security analysis. It finds the classes of mistakes a
# dependency-free Rust CLI can still make: command injection through git
# arguments, path traversal out of the tree, resource leaks. Results land in
# Security > Code scanning, where the README's badge reads from.
#
# A pull request's analysis files itself under refs/pull/N/merge, and only a
# run against main answers for the default branch - so main is scanned by the
# weekly cron, which also picks up what arrives through no commit of ours:
# the query packs and the Rust extractor ride in with the action. The paths
# keep a README-only pull request from paying for an analysis.
name: CodeQL

on:
  pull_request:
    paths:
      - "**.rs"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/codeql.yaml
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
