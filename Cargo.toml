[package]
name = "gm"
version = "0.0.0" # releases stamp their version in through GM_VERSION, see .goreleaser.yaml
edition = "2024"
rust-version = "1.95"
description = "Keep every repository in one predictable tree, and jump between them."
license = "MIT"
publish = false

[dependencies]
libc = "0.2.189"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
divan = "0.1"
# proptest generates inputs the example-based tests never thought of, so the
# functions that turn user input into paths are re-checked for their
# invariants on every run. Regressions a run finds land in
# proptest-regressions/ and are committed: a failure is re-tested forever.
proptest = "1.12.0"

[lints.rust]
# not "forbid": the two FFI sites need a local allow(..., reason = "..."),
# and forbid would silence those for good rather than forcing a fresh reason.
unsafe_code = "deny"
# a call that is not itself sound turns into one the moment the wrapping fn is
# inlined or exported; checking at the call site keeps each one accountable.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# every unsafe block has to carry a // SAFETY: comment, so a new block is a
# written case for why it is sound, not a silent edit.
undocumented_unsafe_blocks = "deny"
# an allow that stays needs a sentence saying why the lint does not apply here.
allow_attributes_without_reason = "deny"

[[bench]]
name = "perf"
harness = false

[profile.release]
strip = true
lto = true
