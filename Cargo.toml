[package]
name = "gm"
version = "0.0.0" # releases stamp their version in through GM_VERSION, see .goreleaser.yaml
edition = "2024"
rust-version = "1.95"
description = "Keep every repository in one predictable tree, and jump between them."
license = "MIT"
publish = false

[dependencies]
libc = "0.2.189"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
strip = true
lto = true
